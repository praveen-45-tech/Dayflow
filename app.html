<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayflow — Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app-shell">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="side-brand">
      <svg width="26" height="26" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="16" stroke="#FFB238" stroke-width="2"/><path d="M17 7v10l7 4" stroke="#FFB238" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Dayflow</span>
    </div>

    <nav class="side-nav" id="side-nav"></nav>

    <div class="side-user">
      <div class="avatar" id="side-avatar"></div>
      <div class="who">
        <div class="name" id="side-name">—</div>
        <div class="role" id="side-role">—</div>
      </div>
      <button class="logout-btn" id="logout-btn" title="Log out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="topbar-title">Overview</h1>
      </div>
      <div class="topbar-actions">
        <span class="date-chip mono" id="date-chip"></span>
      </div>
    </div>

    <!-- OVERVIEW -->
    <section class="section" id="section-overview"></section>
    <!-- PROFILE -->
    <section class="section" id="section-profile"></section>
    <!-- ATTENDANCE -->
    <section class="section" id="section-attendance"></section>
    <!-- LEAVE -->
    <section class="section" id="section-leave"></section>
    <!-- PAYROLL -->
    <section class="section" id="section-payroll"></section>
    <!-- TEAM (admin) -->
    <section class="section" id="section-team"></section>
  </main>
</div>

<div id="toast-root"></div>
<div id="modal-root"></div>

<script src="js/store.js"></script>
<script src="js/dayarc.js"></script>
<script src="js/toast.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
